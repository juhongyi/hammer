services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-presentation}
      POSTGRES_USER: ${POSTGRES_USER:-poc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-poc-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
  api:
    build: ./services/api
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-poc}:${POSTGRES_PASSWORD:-local-poc-password}@db:5432/${POSTGRES_DB:-presentation}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
  presentation:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP: presentation
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
  ontology:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP: ontology
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
