services:
  presentation-web:
    build: ./presentation/web
    init: true
    restart: unless-stopped
    shm_size: 1gb
    volumes:
      - ./presentation/web:/workspace
    ports:
      - "${PRESENTATION_WEB_PORT:-3000}:3000"
    environment:
      CI: ${CI:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 60s

  presentation-api:
    build: ./presentation/api
    init: true
    restart: unless-stopped
    volumes:
      - ./presentation/api:/workspace
    ports:
      - "${PRESENTATION_API_PORT:-8000}:8000"
    environment:
      PGHOST: presentation-db
      PGPORT: "5432"
      PGDATABASE: ${PRESENTATION_DB_NAME:?Set PRESENTATION_DB_NAME}
      PGUSER: ${PRESENTATION_DB_USER:?Set PRESENTATION_DB_USER}
      PGPASSWORD: ${PRESENTATION_DB_PASSWORD:?Set PRESENTATION_DB_PASSWORD}
    depends_on:
      presentation-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  ontology-web:
    build: ./ontology/web
    init: true
    restart: unless-stopped
    shm_size: 1gb
    volumes:
      - ./ontology/web:/workspace
    ports:
      - "${ONTOLOGY_WEB_PORT:-3001}:3000"
    environment:
      CI: ${CI:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 60s

  ontology-api:
    build: ./ontology/api
    init: true
    restart: unless-stopped
    volumes:
      - ./ontology/api:/workspace
    ports:
      - "${ONTOLOGY_API_PORT:-8001}:8000"
    environment:
      PGHOST: ontology-db
      PGPORT: "5432"
      PGDATABASE: ${ONTOLOGY_DB_NAME:?Set ONTOLOGY_DB_NAME}
      PGUSER: ${ONTOLOGY_DB_USER:?Set ONTOLOGY_DB_USER}
      PGPASSWORD: ${ONTOLOGY_DB_PASSWORD:?Set ONTOLOGY_DB_PASSWORD}
    depends_on:
      ontology-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  presentation-db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${PRESENTATION_DB_NAME:?Set PRESENTATION_DB_NAME}
      POSTGRES_USER: ${PRESENTATION_DB_USER:?Set PRESENTATION_DB_USER}
      POSTGRES_PASSWORD: ${PRESENTATION_DB_PASSWORD:?Set PRESENTATION_DB_PASSWORD}
    volumes:
      - presentation_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  ontology-db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${ONTOLOGY_DB_NAME:?Set ONTOLOGY_DB_NAME}
      POSTGRES_USER: ${ONTOLOGY_DB_USER:?Set ONTOLOGY_DB_USER}
      POSTGRES_PASSWORD: ${ONTOLOGY_DB_PASSWORD:?Set ONTOLOGY_DB_PASSWORD}
    volumes:
      - ontology_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  presentation_postgres_data:
  ontology_postgres_data:
