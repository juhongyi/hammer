name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run Compose checks
        run: sh scripts/check.sh all
      - name: Collect service logs
        if: always()
        run: docker compose --env-file .env.example logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            harness/playwright-report
            harness/test-results
          if-no-files-found: ignore
      - name: Stop containers
        if: always()
        run: docker compose --env-file .env.example --profile test down --volumes
