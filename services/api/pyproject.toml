[project]
name = "presentation-poc-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi[standard-no-fastapi-cloud-cli]>=0.143.0,<0.144",
  "sqlmodel[asyncio]>=0.0.48,<0.0.49",
  "psycopg[binary]>=3.2,<4",
  "httpx2>=2.13.1,<3",
  "pydantic-settings>=2.0,<3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.14"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
