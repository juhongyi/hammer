services:
  db:
    ports: !override
      - "127.0.0.1:55432:5432"
  api:
    ports: !override
      - "127.0.0.1:18000:8000"
    volumes:
      - ./services/api/tests:/app/tests:ro
    command: ["uv", "run", "--no-sync", "uvicorn", "tests.e2e_server:app", "--host", "0.0.0.0", "--port", "8000"]
  presentation:
    ports: !override
      - "127.0.0.1:13000:3000"
  ontology:
    ports: !override
      - "127.0.0.1:13001:3000"
